<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For my one and only love :)</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>For you my love :)</h1>
    </header>
</body>

<main>
  <ul class="playlist" id="playlist"></ul>

  <section class="stage" aria-live="polite">
    <div class="frame" id="frame">
      <div class="photo" id="photo">A picture of us per song :></div>
      <p class="caption" id="caption"></p>
    </div>
    <div class="controls">
      <button id="toggle" aria-label="Play or pause" disabled>▶</button>
      <input type="range" id="progress" min="0" max="100" value="0" aria-label="Song progress" disabled>
    </div>
    <p class="note" id="note"></p>
  </section>
</main>

<audio id="player"></audio>
